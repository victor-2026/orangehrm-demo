name: Playwright E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    # PAUSED 2026-09-16: Render Hobby suspended (5GB bandwidth out, reset ~Oct 1).
    # Re-enable when service resumes. Manual runs: workflow_dispatch.
    # - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  test:
    name: E2E + Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Health Check
        continue-on-error: true
        run: |
          curl --retry 3 --retry-delay 5 --max-time 10 \
            "${{ vars.BASE_URL || 'https://orangehrm-app.onrender.com' }}" \
            -o /dev/null -w "%{http_code}" -s || echo "Health check failed - Render service likely asleep"

      - name: Run Playwright smoke tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: npx playwright test --project=smoke

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          pip install playwright pytest
          python3 -m playwright install chromium --with-deps

      - name: Run Python tests
        run: python3 -m pytest python_api_tests/ -v

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/

  full:
    name: Full Suite (TypeScript)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
        env:
          BASE_URL: ${{ vars.BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-results
          path: test-results/
